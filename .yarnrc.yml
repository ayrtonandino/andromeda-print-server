compressionLevel: mixed

enableGlobalCache: true

enableScripts: false

nodeLinker: node-modules

packageExtensions:
  "@antfu/eslint-config@*":
    dependencies:
      "@typescript-eslint/typescript-estree": "*"
      "@typescript-eslint/utils": "*"
      "@vue/compiler-sfc": "*"
      eslint-plugin-erasable-syntax-only: "*"
    peerDependencies:
      typescript: "*"
  "@regle/rules@*":
    peerDependencies:
      vue: "*"
  eslint-plugin-perfectionist@*:
    peerDependencies:
      typescript: "*"
  "@floating-ui/vue@*":
    peerDependencies:
      vue: "*"
  "@nuxt/fonts@*":
    peerDependencies:
      vite: "*"
  "@nuxt/icon@*":
    peerDependencies:
      vite: "*"
      vue: "*"
  "@nuxt/ui@*":
    dependencies:
      "@tiptap/extensions": ^3.32.0
      "@tiptap/y-tiptap": ^3.0.10
      embla-carousel: ^8.6.0
      prosemirror-model: ^1.25.12
      prosemirror-state: ^1.4.4
      prosemirror-view: ^1.42.6
      y-protocols: ^1.0.7
      yjs: ^13.6.33
    peerDependencies:
      vite: "*"
      vue: "*"
  "@vueuse/core@10.11.1":
    peerDependencies:
      vue: "*"
  "@vueuse/shared@10.11.1":
    peerDependencies:
      vue: "*"
  app-builder-lib@*:
    peerDependenciesMeta:
      electron-builder-squirrel-windows:
        optional: true

yarnPath: .yarn/releases/yarn-4.18.1.cjs
